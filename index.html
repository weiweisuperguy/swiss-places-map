<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Swiss picks map · スイスおすすめ地図</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="bar">
      <div class="title">
        <span class="flag" aria-hidden="true">🇨🇭</span>
        <h1 id="title">スイスおすすめ地図</h1>
        <span id="count" class="count"></span>
      </div>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="ja">日本語</button>
        <button type="button" data-lang="en">EN</button>
      </div>
    </header>

    <section class="filters" aria-label="Filters">
      <input id="q" type="search" autocomplete="off">
      <select id="f-type"></select>
      <select id="f-region"></select>
      <select id="f-highlight"></select>
      <select id="f-effort"></select>
      <select id="f-crowds"></select>
      <button id="reset" type="button"></button>
    </section>

    <main class="body">
      <ol id="list" class="list"></ol>
      <div class="mapwrap">
        <div id="map" class="map" role="application"></div>
        <div id="hint" class="hint" hidden></div>
      </div>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>
